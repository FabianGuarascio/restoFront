<div class="min-h-screen bg-slate-100">
  @if (authStore.estaLogueado()) {
    <nav class="bg-slate-900 text-white px-6 py-3 flex items-center gap-6">
      <span class="font-semibold text-lg">🍽️ RestoAdmin</span>
      <a
        routerLink="/pedidos"
        routerLinkActive="text-amber-400"
        class="hover:text-amber-300"
        >Pedidos</a
      >
      <a
        routerLink="/mesas"
        routerLinkActive="text-amber-400"
        class="hover:text-amber-300"
        >Mesas</a
      >
      <a
        routerLink="/menu"
        routerLinkActive="text-amber-400"
        class="hover:text-amber-300"
        >Menú</a
      >

      <div class="ml-auto flex items-center gap-4">
        <span class="text-sm text-slate-300">{{ authStore.usuario()?.nombreUsuario }}</span>
        <button
          type="button"
          (click)="cerrarSesion()"
          class="border border-slate-600 rounded px-3 py-1 text-sm hover:bg-slate-800"
        >
          Salir
        </button>
      </div>
    </nav>
  }

  <main class="p-6">
    <router-outlet />
  </main>
</div>
