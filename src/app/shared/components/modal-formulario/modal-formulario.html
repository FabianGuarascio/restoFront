<app-modal [abierto]="abierto()" [titulo]="titulo()" (cerrar)="cerrar.emit()">
  @if (error()) {
    <p class="text-red-600 text-sm mb-3">{{ error() }}</p>
  }

  <div class="flex flex-col gap-3">
    @if (tipo() === 'categoria') {
      <input
        [(ngModel)]="form.nombre"
        name="nombre"
        placeholder="Nombre"
        class="border rounded px-3 py-1.5"
        required
      />
      <input
        [(ngModel)]="form.descripcion"
        name="descripcion"
        placeholder="Descripción (opcional)"
        class="border rounded px-3 py-1.5"
      />
    } @else {
      <input
        [(ngModel)]="form.nombre"
        name="nombre"
        placeholder="Nombre"
        class="border rounded px-3 py-1.5"
        required
      />
      <input
        [(ngModel)]="form.descripcion"
        name="descripcion"
        placeholder="Descripción"
        class="border rounded px-3 py-1.5"
      />
      <input
        [(ngModel)]="form.precio"
        name="precio"
        type="number"
        min="0"
        step="0.01"
        placeholder="Precio"
        class="border rounded px-3 py-1.5"
        required
      />
      <select
        [(ngModel)]="form.categoriaId"
        name="categoriaId"
        class="border rounded px-3 py-1.5"
        required
      >
        <option [value]="null" disabled>Categoría</option>
        @for (categoria of categoriasStore.items(); track categoria.id) {
          <option [value]="categoria.id">{{ categoria.nombre }}</option>
        }
      </select>
      <label class="flex items-center gap-1 text-sm">
        <input [(ngModel)]="form.disponible" name="disponible" type="checkbox" />
        Disponible
      </label>
    }
  </div>

  <button
    footer
    type="button"
    (click)="cerrar.emit()"
    class="border rounded px-4 py-1.5 hover:bg-slate-50 dark:border-slate-600 dark:hover:bg-slate-700"
  >
    Cancelar
  </button>
  <button
    footer
    type="button"
    (click)="guardar()"
    [disabled]="guardando()"
    class="bg-slate-900 text-white rounded px-4 py-1.5 hover:bg-slate-700 disabled:opacity-50"
  >
    {{ item() ? 'Guardar' : 'Agregar' }}
  </button>
</app-modal>
