<app-modal [abierto]="abierto()" (cerrar)="cerrar.emit()">
  @if (item(); as it) {
    <p class="text-sm text-slate-700 dark:text-slate-300">
      @if (tipo() === 'categoria') {
        ¿Eliminar la categoría "{{ it.nombre }}"?
      } @else if (tipo() === 'producto') {
        ¿Eliminar el producto "{{ it.nombre }}"?
      } @else {
        ¿Eliminar la mesa {{ it.nombre }}?
      }
    </p>
  }

  @if (error()) {
    <p class="text-red-600 text-sm mt-2">{{ error() }}</p>
  }

  <button
    footer
    type="button"
    (click)="cerrar.emit()"
    class="border rounded px-4 py-1.5 hover:bg-slate-50 dark:border-slate-600 dark:hover:bg-slate-700"
  >
    Cancelar
  </button>
  <button
    footer
    type="button"
    (click)="confirmar()"
    [disabled]="eliminando()"
    class="bg-red-600 text-white rounded px-4 py-1.5 hover:bg-red-500 disabled:opacity-50"
  >
    Eliminar
  </button>
</app-modal>
