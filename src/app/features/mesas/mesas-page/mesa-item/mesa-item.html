<div
  class="border-2 rounded-lg p-4 flex flex-col gap-2 relative"
  [class]="mesa().estado | claseEstadoMesa"
>
  <svg
    cdkDragHandle
    title="Arrastrar para reordenar"
    class="absolute top-2 left-2 w-4 h-4 text-slate-400 hover:text-slate-600 cursor-grab active:cursor-grabbing"
    viewBox="0 0 16 16"
    fill="currentColor"
  >
    <circle cx="5" cy="3" r="1.3" />
    <circle cx="11" cy="3" r="1.3" />
    <circle cx="5" cy="8" r="1.3" />
    <circle cx="11" cy="8" r="1.3" />
    <circle cx="5" cy="13" r="1.3" />
    <circle cx="11" cy="13" r="1.3" />
  </svg>

  <p class="text-2xl font-bold pl-6">Mesa {{ mesa().numero }}</p>
  <p class="text-sm">Capacidad: {{ mesa().capacidad }}</p>
  <p class="text-sm font-semibold">{{ mesa().estado }}</p>

  @if (error()) {
    <p class="text-red-600 text-xs">{{ error() }}</p>
  }

  <div class="flex gap-2 text-sm mt-2 min-h-5">
    @if (mesa().estado === 'Libre') {
      <button
        type="button"
        (click)="accion('reservar')"
        class="cursor-pointer underline"
      >
        Reservar
      </button>
      <button
        type="button"
        (click)="accion('eliminar')"
        class="cursor-pointer underline"
      >
        Eliminar
      </button>
    }
    @if (mesa().estado === 'Reservada') {
      <button
        type="button"
        (click)="accion('liberar')"
        class="cursor-pointer underline"
      >
        Liberar
      </button>
    }
  </div>
</div>

<app-modal-eliminar
  tipo="mesa"
  [item]="itemAEliminar()"
  (cerrar)="confirmandoEliminar.set(false)"
/>
