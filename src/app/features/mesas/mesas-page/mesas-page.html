<div class="max-w-5xl mx-auto">
  <div class="flex items-center justify-between mb-4">
    <h1 class="text-xl font-semibold">Mesas</h1>
    <button
      (click)="modalCreacionAbierto.set(true)"
      class="bg-slate-900 text-white rounded px-4 py-1.5 hover:bg-slate-700"
    >
      + Nueva mesa
    </button>
  </div>

  <div
    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"
    cdkDropList
    cdkDropListOrientation="mixed"
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (mesa of mesas(); track mesa.id) {
      <app-mesa-item [mesa]="mesa" cdkDrag [attr.data-mesa-id]="mesa.id" />
    } @empty {
      <p class="text-slate-500 text-sm col-span-full">
        No hay mesas cargadas todavía.
      </p>
    }
  </div>
</div>

@if (modalCreacionAbierto()) {
  <app-modal-crear-mesa (cerrar)="modalCreacionAbierto.set(false)" />
}
