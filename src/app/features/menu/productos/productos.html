<div class="bg-white rounded-lg shadow p-5">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold">Productos</h2>
    <button
      type="button"
      (click)="nuevo()"
      class="bg-slate-900 text-white rounded px-4 py-1.5 hover:bg-slate-700"
    >
      Nuevo producto
    </button>
  </div>

  <ul class="divide-y">
    @for (producto of productos(); track producto.id) {
      <app-producto-item
        [producto]="producto"
        (editar)="editar($event)"
        (eliminar)="eliminar($event)"
      />
    } @empty {
      <li class="py-3 text-slate-500 text-sm">
        No hay productos cargados todavía.
      </li>
    }
  </ul>
</div>

<app-modal-formulario
  tipo="producto"
  [abierto]="modalCreacionAbierto()"
  [item]="itemEditando()"
  (cerrar)="modalCreacionAbierto.set(false)"
/>

<app-modal-eliminar
  tipo="producto"
  [item]="itemAEliminar()"
  (cerrar)="itemAEliminar.set(null)"
/>
