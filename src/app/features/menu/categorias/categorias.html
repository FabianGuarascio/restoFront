<div class="bg-white rounded-lg shadow p-5">
  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-semibold">Categorías</h2>
    <button
      type="button"
      (click)="nueva()"
      class="bg-slate-900 text-white rounded px-4 py-1.5 hover:bg-slate-700"
    >
      Nueva categoría
    </button>
  </div>

  @if (cargando()) {
    <app-loading-spinner />
  } @else if (errorCarga()) {
    <app-error-banner
      [mensaje]="errorCarga()!"
      (reintentar)="reintentarCarga()"
    />
  } @else {
    <ul class="divide-y">
      @for (categoria of categorias(); track categoria.id) {
        <app-categoria-item
          [categoria]="categoria"
          (editar)="editar($event)"
          (eliminar)="eliminar($event)"
        />
      } @empty {
        <li class="py-3 text-slate-500 text-sm">
          No hay categorías cargadas todavía.
        </li>
      }
    </ul>
  }
</div>

<app-modal-formulario
  tipo="categoria"
  [abierto]="modalCreacionAbierto()"
  [item]="itemEditando()"
  (cerrar)="modalCreacionAbierto.set(false)"
/>

<app-modal-eliminar
  tipo="categoria"
  [item]="itemAEliminar()"
  (cerrar)="itemAEliminar.set(null)"
/>
