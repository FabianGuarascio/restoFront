<div class="bg-white rounded-lg shadow p-5">
  <h2 class="text-lg font-semibold mb-4">Categorías</h2>

  @if (error()) {
    <p class="text-red-600 text-sm mb-3">{{ error() }}</p>
  }

  <form (ngSubmit)="guardar()" class="flex flex-wrap gap-2 mb-4">
    <input
      [(ngModel)]="form.nombre"
      name="nombre"
      placeholder="Nombre"
      class="border rounded px-3 py-1.5 flex-1 min-w-[140px]"
      required
    />
    <input
      [(ngModel)]="form.descripcion"
      name="descripcion"
      placeholder="Descripción (opcional)"
      class="border rounded px-3 py-1.5 flex-1 min-w-[180px]"
    />
    <button
      type="submit"
      class="bg-slate-900 text-white rounded px-4 py-1.5 hover:bg-slate-700"
    >
      {{ editingId() ? 'Guardar' : 'Agregar' }}
    </button>
    @if (editingId()) {
      <button
        type="button"
        (click)="cancelar()"
        class="border rounded px-4 py-1.5 hover:bg-slate-50"
      >
        Cancelar
      </button>
    }
  </form>

  <ul class="divide-y">
    @for (categoria of categorias(); track categoria.id) {
      <app-categoria-item
        [categoria]="categoria"
        (editar)="editar($event)"
        (eliminar)="eliminar($event)"
      />
    } @empty {
      <li class="py-3 text-slate-500 text-sm">
        No hay categorías cargadas todavía.
      </li>
    }
  </ul>
</div>
