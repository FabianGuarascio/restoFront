<div class="bg-white rounded-lg shadow p-5">
  <h2 class="text-lg font-semibold mb-4">Categorías</h2>

  @if (error()) {
    <p class="text-red-600 text-sm mb-3">{{ error() }}</p>
  }

  <form (ngSubmit)="guardar()" class="flex flex-wrap gap-2 mb-4">
    <input
      [(ngModel)]="form.nombre"
      name="nombre"
      placeholder="Nombre"
      class="border rounded px-3 py-1.5 flex-1 min-w-[140px]"
      required
    />
    <input
      [(ngModel)]="form.descripcion"
      name="descripcion"
      placeholder="Descripción (opcional)"
      class="border rounded px-3 py-1.5 flex-1 min-w-[180px]"
    />
    <button type="submit" class="bg-slate-900 text-white rounded px-4 py-1.5 hover:bg-slate-700">
      {{ editingId() ? 'Guardar' : 'Agregar' }}
    </button>
    @if (editingId()) {
      <button
        type="button"
        (click)="cancelar()"
        class="border rounded px-4 py-1.5 hover:bg-slate-50"
      >
        Cancelar
      </button>
    }
  </form>

  <ul class="divide-y">
    @for (categoria of categorias(); track categoria.id) {
      <li class="flex items-center justify-between py-2">
        <div>
          <p class="font-medium">{{ categoria.nombre }}</p>
          @if (categoria.descripcion) {
            <p class="text-sm text-slate-500">{{ categoria.descripcion }}</p>
          }
        </div>
        <div class="flex gap-2 text-sm">
          <button (click)="editar(categoria)" class="text-blue-600 hover:underline">Editar</button>
          <button (click)="eliminar(categoria)" class="text-red-600 hover:underline">
            Eliminar
          </button>
        </div>
      </li>
    } @empty {
      <li class="py-3 text-slate-500 text-sm">No hay categorías cargadas todavía.</li>
    }
  </ul>
</div>
